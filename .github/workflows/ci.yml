name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate repository policy
        run: |
          test -x scripts/install-hooks
          test -x .githooks/pre-commit
          test -x .githooks/pre-push
          test ! -e REVIEW.md
      - name: Build
        run: swift build
      - name: Test
        run: swift test
