name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` and `unlabeled` are here for the Labels job below. Without them
    # a pull request held back for a missing label would stay red until its next
    # push, long after someone applied the label.
    types: [opened, reopened, labeled, unlabeled, synchronize]

permissions:
  contents: read

jobs:
  # Release notes are generated from the merged pull requests and grouped by
  # label (.github/release.yml), so a pull request without exactly one category
  # label is a changelog line in the wrong section or in no section at all.
  labels:
    name: Labels
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Require exactly one category label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        # This job runs directly on the runner, where bash is already the
        # default, but the arrays and `pipefail` below are bash-only: a job that
        # gained a container would silently drop to `sh -e` and lose both.
        shell: bash
        run: |
          set -euo pipefail

          # Exactly the labels .github/release.yml categorises, and exactly the
          # table in README.md. Changing one means changing all three.
          allowed=(
            feature
            fix
            security
            performance
            tooling
            ci
            documentation
            docs
            dependencies
            "skip changelog"
          )

          # The live label set rather than the event payload's copy, which is
          # only a snapshot of whenever the event was delivered.
          gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST" \
            --jq '.labels[].name' > "$RUNNER_TEMP/pull-request-labels"

          applied=()
          # `|| [ -n "$name" ]` so a final line without a trailing newline is
          # still counted rather than silently dropped.
          while IFS= read -r name || [ -n "$name" ]; do
            for candidate in "${allowed[@]}"; do
              if [ "$name" = "$candidate" ]; then
                applied+=("$name")
                break
              fi
            done
          done < "$RUNNER_TEMP/pull-request-labels"

          if [ "${#applied[@]}" -eq 1 ]; then
            echo "Category label: ${applied[0]}"
            exit 0
          fi

          if [ "${#applied[@]}" -eq 0 ]; then
            carried='it carries none of them'
          else
            carried="it carries ${#applied[@]}: $(printf '%s, ' "${applied[@]}" | sed 's/, $//')"
          fi

          {
            printf 'Every pull request needs exactly one category label; %s.\n' "$carried"
            printf 'Allowed labels: %s.\n' "$(printf '%s, ' "${allowed[@]}" | sed 's/, $//')"
            printf 'The label chooses the release-notes section in .github/release.yml.\n'
            printf 'Use "skip changelog" for a change that should not appear in the notes at all.\n'
            printf 'The repository squash-merges, so the pull-request title becomes the\n'
            printf 'changelog line: keep it concise and imperative.\n'
            printf 'See the "Pull requests" section of README.md.\n'
          } >&2
          exit 1

  build-and-test:
    name: macOS (menu-bar app, core, CLI)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate repository policy
        run: |
          test -x scripts/install-hooks
          test -x scripts/install-codex-skills
          test -x scripts/codex-parallel
          test -x scripts/coverage
          test -x .githooks/pre-commit
          test -x .githooks/pre-push
          test ! -e REVIEW.md
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  build-and-test-linux:
    name: Linux (core, CLI)
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    defaults:
      run:
        # Container jobs default to `sh -e`, which has no pipefail.
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: CLI smoke test
        run: |
          swift run quotabar --version
          swift run quotabar --help
      # Enforced. The threshold went in only once the suite actually cleared it:
      # main was at 95.18% region / 98.27% line when this was switched on, so it
      # has never been a gate that main could not pass.
      - name: Coverage
        env:
          MINIMUM_REGION: '90'
        run: |
          set -euo pipefail
          scripts/coverage --lcov coverage.lcov > coverage.txt
          {
            printf '## Coverage (Linux: QuotaCore, QuotaTray)\n\n'
            printf '```\n'
            cat coverage.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

          # llvm-cov's TOTAL row; the region percentage is the fourth column.
          region="$(awk '/^TOTAL/ {gsub(/%/,"",$4); print $4}' coverage.txt)"
          if [ -z "$region" ]; then
            echo "Could not read a TOTAL row from the coverage report." >&2
            exit 1
          fi
          awk -v got="$region" -v min="$MINIMUM_REGION" '
            BEGIN {
              if (got + 0 < min + 0) {
                printf "Region coverage %.2f%% is below the %s%% minimum.\n", got, min > "/dev/stderr"
                exit 1
              }
              printf "Region coverage %.2f%% meets the %s%% minimum.\n", got, min
            }' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage lcov
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov-linux
          path: coverage.lcov
          if-no-files-found: error
