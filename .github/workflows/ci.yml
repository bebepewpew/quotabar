name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: macOS (menu-bar app, core, CLI)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate repository policy
        run: |
          test -x scripts/install-hooks
          test -x scripts/install-codex-skills
          test -x scripts/codex-parallel
          test -x scripts/coverage
          test -x .githooks/pre-commit
          test -x .githooks/pre-push
          test ! -e REVIEW.md
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  build-and-test-linux:
    name: Linux (core, CLI)
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: CLI smoke test
        run: |
          swift run quotabar --version
          swift run quotabar --help
      # Reported only. There is deliberately no threshold yet, so a coverage
      # drop is visible in the step summary without failing the run.
      - name: Coverage
        run: |
          scripts/coverage --lcov coverage.lcov > coverage.txt
          {
            printf '## Coverage (Linux: QuotaCore, QuotaTray)\n\n'
            printf '```\n'
            cat coverage.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage lcov
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-linux
          path: coverage.lcov
          if-no-files-found: error
