name: CodeQL

on:
  # Called by ci.yml rather than triggered directly, so this analysis sits behind
  # the same `changes` filter as the build jobs and behind the same Gate. A
  # `paths-ignore` here instead would have been unusable the moment anyone
  # required this check: a workflow a path filter stops from running never
  # reports, and a required check that never reports blocks the merge for good.
  workflow_call:
  schedule:
    # Weekly, so newly published CodeQL queries reach the default branch even
    # when nothing has been merged for a while. This one runs standalone; the
    # `changes` filter has nothing to compare a scheduled run against.
    - cron: '17 4 * * 1'

permissions:
  contents: read

# No `concurrency` here. When this is called, ci.yml's group already covers the
# run, and a reusable workflow carrying its own group can queue behind the caller
# that is waiting for it.

jobs:
  analyze:
    name: Analyse Swift
    # The Swift toolchain is preinstalled on the macOS runners, and the
    # SwiftUI/AppKit menu-bar target only exists there (see Package.swift), so
    # macOS is the only host where one build covers QuotaCore, QuotaTray,
    # QuotaBarCLI and the menu-bar app itself.
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # The Swift extractor only sees code that is really compiled, so the build
      # has to run between init and analyze and must not be served from a cache
      # of prebuilt artifacts.
      - name: Build
        run: swift build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
